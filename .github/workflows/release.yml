name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: git apply --reverse --check third_party/webdav.patch
      - run: go test -mod=vendor -count=1 -timeout=10m ./...
      - run: go vet -mod=vendor ./...
      - if: runner.os == 'Linux'
        run: go test -mod=vendor -race -count=1 -timeout=10m ./...

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Obtain authorized SDK
        shell: pwsh
        env:
          SDK_URL: ${{ secrets.CLOUDPROBE_SDK_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:SDK_URL -or ([Uri]$env:SDK_URL).Scheme -ne 'https') {
            throw 'Configure CLOUDPROBE_SDK_URL with an authorized HTTPS SDK ZIP; an EXE-only package must not be published.'
          }
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cloudprobe-sdk'
          New-Item -ItemType Directory -Path $sdkRoot | Out-Null
          try { Invoke-WebRequest -Uri $env:SDK_URL -OutFile "$sdkRoot.zip" } catch { throw 'SDK download failed; check CLOUDPROBE_SDK_URL.' }
          Expand-Archive -LiteralPath "$sdkRoot.zip" -DestinationPath $sdkRoot
          "CLOUDPROBE_SDK_PATH=$sdkRoot" >> $env:GITHUB_ENV
      - name: Build full package and verify engine startup
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/package-windows.ps1 -SdkPath $env:CLOUDPROBE_SDK_PATH -OutputRoot "$env:GITHUB_WORKSPACE/dist" -ExpectedTag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Linux command line packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const version = "\([^"]*\)"/\1/p' main.go)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then exit 1; fi
          mkdir -p dist
          for arch in amd64 arm64; do
            name="CloudProbe_v${version}_linux_${arch}"
            mkdir -p "dist/$name"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -mod=vendor -trimpath -ldflags='-s -w' -o "dist/$name/cloudprobe" .
            printf '%s\n' 'Linux command line package. The original Windows SDK engine is not included or supported on Linux.' > "dist/$name/README.txt"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
